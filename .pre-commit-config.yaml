repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        entry: check-yaml --unsafe

  - repo: https://github.com/pycqa/isort
    rev: 10.0.0b1
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        entry: flake8 --max-line-length 88